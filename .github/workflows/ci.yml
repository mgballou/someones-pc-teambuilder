name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  # A branch behind its base passes this gate with a notice and skips the test
  # jobs: a stale branch is not a failure, and updating it is the author's call.
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.base.outputs.run }}
    steps:
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A failed lookup runs CI rather than skipping it.
          behind=$(gh api "repos/$REPO/compare/$BASE...$HEAD_SHA" --jq .behind_by) || behind=0
          if [ "$behind" = "0" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::This branch is $behind commits behind $BASE. Update it to run CI."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spc
          POSTGRES_PASSWORD: spc
          POSTGRES_DB: someones_pc
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U spc -d someones_pc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://spc:spc@localhost:5433/someones_pc

    steps:
      - uses: actions/checkout@v7

      # No `version` here on purpose. The action reads `packageManager` from
      # package.json, and pinning it in both places is an error, not a default.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The dataset is committed, so nothing here touches PokéAPI.
      - run: pnpm typecheck
      - run: pnpm lint

      # The web tests write real rows, so the schema goes in before they run.
      - run: pnpm db:push
      - run: pnpm test

      - run: pnpm db:seed
      - run: pnpm build
