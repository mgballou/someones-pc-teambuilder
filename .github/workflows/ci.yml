name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.base.outputs.run }}
    steps:
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed lookup runs CI rather than failing the gate.
          behind=$(gh api "repos/${{ github.repository }}/compare/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}" --jq .behind_by) || behind=0
          if [ "$behind" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::This branch is $behind commits behind ${{ github.base_ref }}. Update it to run CI."; echo "run=false" >> "$GITHUB_OUTPUT"; fi

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spc
          POSTGRES_PASSWORD: spc
          POSTGRES_DB: someones_pc
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U spc -d someones_pc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://spc:spc@localhost:5433/someones_pc

    steps:
      - uses: actions/checkout@v7

      # No `version` here on purpose. The action reads `packageManager` from
      # package.json, and pinning it in both places is an error, not a default.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The dataset is committed, so nothing here touches PokéAPI.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm db:push
      - run: pnpm db:seed
      - run: pnpm build
