name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spc
          POSTGRES_PASSWORD: spc
          POSTGRES_DB: someones_pc
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U spc -d someones_pc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://spc:spc@localhost:5433/someones_pc
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real

    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose. The action reads `packageManager` from
      # package.json, and pinning it in both places is an error, not a default.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The dataset is committed, so nothing here touches PokéAPI.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm db:push
      - run: pnpm db:seed
      - run: pnpm build
