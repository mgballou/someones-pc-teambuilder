services:
  db:
    image: postgres:17-alpine
    container_name: someones-pc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spc
      POSTGRES_PASSWORD: spc
      POSTGRES_DB: someones_pc
    ports:
      - '5433:5432'
    volumes:
      - spc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spc -d someones_pc']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spc-pgdata:
